name: Build DD-7X Vocal Delay APK

on:
  workflow_dispatch:
    inputs:
      whatsapp_number:
        description: "Founder WhatsApp number (with country code, e.g. 9198XXXXXXXX)"
        required: false
        default: "919800000000"
  push:
    branches: [ main, master ]

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Run C++20 DSP Unit Tests
        run: |
          CPP="android-app/app/src/main/cpp"
          g++ -std=c++20 -O2 -I"$CPP" \
            "$CPP/dsp/DelayLine.cpp" \
            "$CPP/dsp/AnalogFilter.cpp" \
            "$CPP/dsp/ModLfo.cpp" \
            "$CPP/dsp/PingPongMatrix.cpp" \
            "$CPP/dsp/SoftLimiter.cpp" \
            "$CPP/dsp/DelayEngine.cpp" \
            "$CPP/io/WavWriter.cpp" \
            "$CPP/io/Mp3Encoder.cpp" \
            "$CPP/io/OfflineRenderer.cpp" \
            "$CPP/tests/dsp_unit_tests.cpp" \
            -ldl -o ./dd7_dsp_tests
          ./dd7_dsp_tests
          rm -f ./dd7_dsp_tests

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK, NDK & CMake
        uses: android-actions/setup-android@v3
        with:
          packages: "platforms;android-35 build-tools;35.0.0 ndk;27.0.12077973 cmake;3.22.1"

      - name: Set up Gradle 8.10.2
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"

      - name: Generate local.properties for Cloud Build
        env:
          PUB_KEY: ${{ secrets.LICENSE_PUBLIC_KEY_ED25519 }}
          API_URL: ${{ secrets.LICENSE_API_BASE_URL }}
          ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          WA_NUM: ${{ github.event.inputs.whatsapp_number || secrets.FOUNDER_WHATSAPP_NUMBER || '919800000000' }}
        run: |
          cat <<EOF > android-app/local.properties
          sdk.dir=${ANDROID_HOME}
          LICENSE_PUBLIC_KEY_ED25519=${PUB_KEY}
          LICENSE_API_BASE_URL=${API_URL}
          SUPABASE_ANON_KEY=${ANON_KEY}
          FOUNDER_WHATSAPP_NUMBER=${WA_NUM}
          FREE_TRIAL_EXPORT_LIMIT_SEC=30
          EOF

      - name: Build Android APK (Debug Ready-to-Install)
        working-directory: android-app
        run: gradle assembleDebug --no-daemon

      - name: Upload Downloadable APK
        uses: actions/upload-artifact@v4
        with:
          name: DD7X-Vocal-Delay-APK
          path: android-app/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
