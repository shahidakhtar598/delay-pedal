name: Build DD-7X Vocal Delay APK

on:
  workflow_dispatch:
    inputs:
      whatsapp_number:
        description: "WhatsApp number with country code (e.g. 9198XXXXXXXX)"
        required: false
        default: "919800000000"
  push:
    branches: [ main, master ]

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Unpack ZIP and locate android-app
        id: paths
        run: |
          ZIP_FILE=$(ls *.zip 2>/dev/null | head -n 1 || true)
          if [ -n "$ZIP_FILE" ]; then
            unzip -oq "$ZIP_FILE" -d _unpacked
          fi

          if [ -d "_unpacked/dd7-vocal-delay-pedal/android-app" ]; then
            echo "app_dir=_unpacked/dd7-vocal-delay-pedal/android-app" >> "$GITHUB_OUTPUT"
          elif [ -d "android-app" ]; then
            echo "app_dir=android-app" >> "$GITHUB_OUTPUT"
          elif [ -d "dd7-vocal-delay-pedal/android-app" ]; then
            echo "app_dir=dd7-vocal-delay-pedal/android-app" >> "$GITHUB_OUTPUT"
          else
            echo "ZIP ya android-app folder nahi mila!"
            ls -la
            exit 1
          fi

      - name: Run C++20 DSP Unit Tests
        run: |
          CPP="${{ steps.paths.outputs.app_dir }}/app/src/main/cpp"
          g++ -std=c++20 -O2 -I"$CPP" \
            "$CPP/dsp/DelayLine.cpp" \
            "$CPP/dsp/AnalogFilter.cpp" \
            "$CPP/dsp/ModLfo.cpp" \
            "$CPP/dsp/PingPongMatrix.cpp" \
            "$CPP/dsp/SoftLimiter.cpp" \
            "$CPP/dsp/DelayEngine.cpp" \
            "$CPP/io/WavWriter.cpp" \
            "$CPP/io/Mp3Encoder.cpp" \
            "$CPP/io/OfflineRenderer.cpp" \
            "$CPP/tests/dsp_unit_tests.cpp" \
            -ldl -o ./dd7_dsp_tests
          ./dd7_dsp_tests
          rm -f ./dd7_dsp_tests

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK, NDK & CMake
        uses: android-actions/setup-android@v3
        with:
          packages: "platforms;android-35 build-tools;35.0.0 ndk;27.0.12077973 cmake;3.22.1"

      - name: Set up Gradle 8.10.2
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"

      - name: Generate local.properties
        env:
          WA_NUM: ${{ github.event.inputs.whatsapp_number || secrets.FOUNDER_WHATSAPP_NUMBER || '919800000000' }}
        run: |
          cat <<EOF > "${{ steps.paths.outputs.app_dir }}/local.properties"
          sdk.dir=${ANDROID_HOME}
          LICENSE_PUBLIC_KEY_ED25519=${{ secrets.LICENSE_PUBLIC_KEY_ED25519 }}
          LICENSE_API_BASE_URL=${{ secrets.LICENSE_API_BASE_URL }}
          SUPABASE_ANON_KEY=${{ secrets.SUPABASE_ANON_KEY }}
          FOUNDER_WHATSAPP_NUMBER=${WA_NUM}
          FREE_TRIAL_EXPORT_LIMIT_SEC=30
          EOF

      - name: Build Android APK
        working-directory: ${{ steps.paths.outputs.app_dir }}
        run: gradle assembleDebug --no-daemon

      - name: Upload Downloadable APK
        uses: actions/upload-artifact@v4
        with:
          name: DD7X-Vocal-Delay-APK
          path: ${{ steps.paths.outputs.app_dir }}/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
